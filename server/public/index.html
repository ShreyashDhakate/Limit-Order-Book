<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C++ LOB Exchange</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131722; --panel2:#0e1119; --border:#1e2330;
    --text:#d1d4dc; --muted:#787b86; --accent:#2962ff;
    --buy:#26a69a; --sell:#ef5350; --buy-dim:rgba(38,166,154,.18); --sell-dim:rgba(239,83,80,.18);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif;font-size:14px}
  .mono{font-family:"Consolas","SF Mono",monospace;font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;
    background:var(--panel);border-bottom:1px solid var(--border)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .tag{font-size:11px;color:var(--muted);border:1px solid var(--border);
    padding:2px 8px;border-radius:10px}
  .live{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--buy);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .grid{display:grid;grid-template-columns:230px 1fr 320px;gap:12px;padding:12px;
    height:calc(100vh - 53px)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;
    display:flex;flex-direction:column;overflow:hidden}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin:0;padding:10px 12px;border-bottom:1px solid var(--border)}
  .scroll{overflow-y:auto}
  /* watchlist */
  .wl-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
    cursor:pointer;border-bottom:1px solid var(--panel2)}
  .wl-row:hover{background:var(--panel2)}
  .wl-row.sel{background:linear-gradient(90deg,rgba(41,98,255,.16),transparent);
    border-left:3px solid var(--accent)}
  .wl-sym{font-weight:600}
  .wl-px{text-align:right}
  .wl-chg{font-size:11px}
  /* center */
  .sym-head{display:flex;align-items:baseline;gap:12px;padding:12px}
  .sym-head .big{font-size:26px;font-weight:600}
  .sym-head .name{font-size:18px;color:var(--muted)}
  canvas{width:100%;height:90px;display:block}
  .ladder{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .lad-head,.lad-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;
    padding:3px 14px;font-size:13px}
  .lad-head{color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)}
  .lad-row{position:relative}
  .lad-row .bar{position:absolute;top:0;bottom:0;right:0;z-index:0}
  .lad-row.bid .bar{background:var(--buy-dim)}
  .lad-row.ask .bar{background:var(--sell-dim)}
  .lad-row span{position:relative;z-index:1}
  .lad-row .px{font-weight:600}
  .lad-row.ask .px{color:var(--sell)} .lad-row.bid .px{color:var(--buy)}
  .lad-row .qty{text-align:right} .lad-row .tot{text-align:right;color:var(--muted)}
  .spread{display:flex;justify-content:center;gap:10px;padding:6px;color:var(--muted);
    font-size:12px;background:var(--panel2);border-top:1px solid var(--border);
    border-bottom:1px solid var(--border)}
  /* right column */
  .stack{display:flex;flex-direction:column;gap:12px;overflow-y:auto}
  .ticket{padding:12px;display:flex;flex-direction:column;gap:10px}
  .side-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .side-toggle button{padding:9px;border:1px solid var(--border);background:var(--panel2);
    color:var(--text);border-radius:6px;cursor:pointer;font-weight:600}
  .side-toggle button.buy.on{background:var(--buy);border-color:var(--buy);color:#04221f}
  .side-toggle button.sell.on{background:var(--sell);border-color:var(--sell);color:#2a0606}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
  select,input{width:100%;padding:8px;background:var(--panel2);border:1px solid var(--border);
    border-radius:6px;color:var(--text);font-size:14px}
  input:disabled{opacity:.4}
  .submit{padding:11px;border:none;border-radius:6px;font-weight:700;cursor:pointer;
    color:#fff;font-size:14px}
  .submit.buy{background:var(--buy);color:#04221f} .submit.sell{background:var(--sell);color:#2a0606}
  .msg{font-size:12px;min-height:16px;color:var(--muted)}
  .msg.ok{color:var(--buy)} .msg.err{color:var(--sell)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:right;padding:5px 10px} th{color:var(--muted);font-weight:500;font-size:11px}
  th:first-child,td:first-child{text-align:left}
  tbody tr{border-top:1px solid var(--panel2)}
  .x{cursor:pointer;color:var(--sell);font-weight:700}
  .tape-row td.b{color:var(--buy)} .tape-row td.s{color:var(--sell)}
  .btn{padding:7px 12px;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;cursor:pointer;font-size:12px}
  .btn:hover{border-color:var(--accent)}
  .green{color:var(--buy)} .red{color:var(--sell)}
  .report-actions{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
  /* report modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;z-index:10}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    width:min(680px,92vw);max-height:86vh;overflow:auto}
  .modal-head{display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;border-bottom:1px solid var(--border)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px}
  .card .k{font-size:11px;color:var(--muted)} .card .v{font-size:18px;font-weight:600;margin-top:3px}
</style>
</head>
<body>
<header>
  <h1>C++&nbsp;LOB&nbsp;Exchange</h1>
  <span class="tag">price&middot;time priority matching engine</span>
  <span class="tag">cpp-httplib</span>
  <div class="live"><span class="dot"></span><span id="clock">live</span></div>
</header>

<div class="grid">
  <!-- WATCHLIST -->
  <div class="panel">
    <h2>Watchlist</h2>
    <div class="scroll" id="watchlist"></div>
  </div>

  <!-- CENTER: chart + ladder -->
  <div class="panel">
    <div class="sym-head">
      <span class="big mono" id="selLast">--</span>
      <span class="name" id="selSym">--</span>
      <span id="selChg" class="mono"></span>
    </div>
    <canvas id="spark" width="600" height="90"></canvas>
    <div class="ladder">
      <div class="lad-head"><span>Price</span><span class="qty">Size</span><span class="tot">Total</span></div>
      <div id="asks"></div>
      <div class="spread"><span id="spreadTxt">spread --</span></div>
      <div id="bids"></div>
    </div>
  </div>

  <!-- RIGHT: ticket + orders + tape -->
  <div class="panel">
    <div class="stack">
      <div class="ticket">
        <h2 style="padding:0;border:none;margin-bottom:2px">Order Ticket</h2>
        <div class="side-toggle">
          <button class="buy on" id="btnBuy" onclick="setSide('BUY')">BUY</button>
          <button class="sell" id="btnSell" onclick="setSide('SELL')">SELL</button>
        </div>
        <div>
          <label>Order type</label>
          <select id="otype" onchange="onTypeChange()">
            <option value="GTC">Limit (Good-Till-Cancel)</option>
            <option value="MKT">Market</option>
            <option value="IOC">Immediate-or-Cancel</option>
            <option value="FOK">Fill-or-Kill</option>
          </select>
        </div>
        <div>
          <label>Limit price ($)</label>
          <input id="oprice" class="mono" type="number" step="0.01" placeholder="0.00" />
        </div>
        <div>
          <label>Quantity (shares)</label>
          <input id="oqty" class="mono" type="number" step="1" value="100" />
        </div>
        <button class="submit buy" id="submitBtn" onclick="placeOrder()">BUY AAPL</button>
        <div class="msg" id="orderMsg"></div>
      </div>

      <div class="panel" style="margin:0 12px">
        <h2>My Orders</h2>
        <table><thead><tr><th>Sym</th><th>Side</th><th>Price</th><th>Qty</th><th></th></tr></thead>
        <tbody id="myorders"></tbody></table>
        <div style="height:6px"></div>
      </div>

      <div class="panel" style="margin:0 12px 12px">
        <h2>Time &amp; Sales</h2>
        <table><thead><tr><th>Price</th><th>Size</th><th>Side</th></tr></thead>
        <tbody id="tape"></tbody></table>
        <div class="report-actions">
          <button class="btn" onclick="openReport()">Generate report</button>
          <a class="btn" href="/api/report.csv">Download CSV</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- REPORT MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeReport()">
  <div class="modal">
    <div class="modal-head"><h2 style="border:none;padding:0">Session Report</h2>
      <button class="btn" onclick="closeReport()">Close</button></div>
    <div class="cards" id="reportCards"></div>
    <table style="margin-bottom:14px"><thead><tr>
      <th>Symbol</th><th>Bought</th><th>Sold</th><th>Position</th>
      <th>Avg Buy</th><th>Avg Sell</th><th>Mark</th><th>P&amp;L</th></tr></thead>
      <tbody id="reportRows"></tbody></table>
  </div>
</div>

<script>
// ---------- state ----------
let SEL = "AAPL";
let SIDE = "BUY";
const sparks = {};                 // symbol -> recent prices

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const money = c => (c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const signClass = n => n>0?"green":n<0?"red":"";
const sign = n => (n>0?"+":"") + n;
async function getJSON(u){ const r = await fetch(u); return r.json(); }

// ---------- order ticket ----------
function setSide(s){
  SIDE=s;
  $("btnBuy").classList.toggle("on",s==="BUY");
  $("btnSell").classList.toggle("on",s==="SELL");
  const b=$("submitBtn");
  b.className="submit "+(s==="BUY"?"buy":"sell");
  b.textContent=`${s} ${SEL}`;
}
function onTypeChange(){
  const isMkt = $("otype").value==="MKT";
  $("oprice").disabled = isMkt;
  if(isMkt) $("oprice").value="";
}
async function placeOrder(){
  const type=$("otype").value;
  const qty=parseInt($("oqty").value||"0",10);
  const priceCents = type==="MKT" ? 0 : Math.round(parseFloat($("oprice").value||"0")*100);
  const msg=$("orderMsg");
  if(qty<=0){ msg.className="msg err"; msg.textContent="Enter a quantity > 0"; return; }
  if(type!=="MKT" && priceCents<=0){ msg.className="msg err"; msg.textContent="Enter a limit price"; return; }
  const body=new URLSearchParams({symbol:SEL,side:SIDE,type,price:priceCents,qty});
  const r=await fetch("/api/order",{method:"POST",body});
  const d=await r.json();
  if(!d.accepted){ msg.className="msg err"; msg.textContent="Rejected: "+d.message; return; }
  msg.className="msg ok";
  msg.textContent = d.filledQty>0
    ? `Filled ${d.filledQty}${d.restingQty>0?` (+${d.restingQty} resting)`:""} — ${d.message}`
    : d.message;
  refresh();
}

// ---------- rendering ----------
function renderWatch(rows){
  $("watchlist").innerHTML = rows.map(q=>`
    <div class="wl-row ${q.symbol===SEL?'sel':''}" onclick="selectSym('${q.symbol}')">
      <div><div class="wl-sym">${q.symbol}</div>
        <div class="wl-chg ${signClass(q.change)}">${q.changePct>0?'+':''}${q.changePct}%</div></div>
      <div class="wl-px mono">$${money(q.last)}</div>
    </div>`).join("");
  const me = rows.find(q=>q.symbol===SEL);
  if(me){
    $("selSym").textContent=SEL;
    $("selLast").textContent="$"+money(me.last);
    const chg = (me.change>0?'+':me.change<0?'-':'') + '$' + money(Math.abs(me.change));
    $("selChg").textContent=`${chg} (${me.changePct}%)`;
    $("selChg").className="mono "+signClass(me.change);
    (sparks[SEL]=sparks[SEL]||[]).push(me.last);
    if(sparks[SEL].length>80) sparks[SEL].shift();
    drawSpark();
  }
}
function renderBook(d){
  const all=[...d.bids.map(l=>l.qty),...d.asks.map(l=>l.qty),1];
  const max=Math.max(...all);
  const row=(l,cls)=>{
    const w=(l.qty/max*100).toFixed(0);
    return `<div class="lad-row ${cls}"><div class="bar" style="width:${w}%"></div>
      <span class="px mono">$${money(l.price)}</span>
      <span class="qty mono">${l.qty}</span>
      <span class="tot mono">${l.orders}</span></div>`;
  };
  // asks: show worst on top so best ask sits just above the spread
  $("asks").innerHTML = d.asks.slice().reverse().map(l=>row(l,"ask")).join("");
  $("bids").innerHTML = d.bids.map(l=>row(l,"bid")).join("");
  $("spreadTxt").textContent = d.spread==null ? "one-sided"
      : `spread $${money(d.spread)}  •  bid $${money(d.bestBid)} / ask $${money(d.bestAsk)}`;
}
function renderTape(rows){
  $("tape").innerHTML = rows.map(t=>`
    <tr class="tape-row"><td class="mono ${t.side==='BUY'?'b':'s'}">$${money(t.price)}</td>
      <td class="mono">${t.qty}</td><td class="${t.side==='BUY'?'b':'s'}">${t.side==='BUY'?'▲':'▼'}</td></tr>`).join("");
}
function renderMyOrders(rows){
  $("myorders").innerHTML = rows.length? rows.map(o=>`
    <tr><td>${o.symbol}</td><td class="${o.side==='BUY'?'green':'red'}">${o.side}</td>
      <td class="mono">$${money(o.price)}</td><td class="mono">${o.qty}</td>
      <td class="x" onclick="cancelOrder(${o.id})">&times;</td></tr>`).join("")
    : `<tr><td colspan="5" style="color:var(--muted);text-align:center">no open orders</td></tr>`;
}
async function cancelOrder(id){ await fetch("/api/cancel",{method:"POST",body:new URLSearchParams({id})}); refresh(); }

function drawSpark(){
  const c=$("spark"), ctx=c.getContext("2d");
  const w=c.width=c.clientWidth, h=c.height;
  ctx.clearRect(0,0,w,h);
  const data=sparks[SEL]||[]; if(data.length<2) return;
  const min=Math.min(...data), max=Math.max(...data), rng=(max-min)||1;
  const up = data[data.length-1]>=data[0];
  ctx.strokeStyle = up?getCss('--buy'):getCss('--sell'); ctx.lineWidth=1.5;
  ctx.beginPath();
  data.forEach((p,i)=>{ const x=i/(data.length-1)*w, y=h-8-((p-min)/rng)*(h-16);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle = up?'rgba(38,166,154,.10)':'rgba(239,83,80,.10)'; ctx.fill();
}
const getCss = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---------- report ----------
async function openReport(){
  const d=await getJSON("/api/report");
  $("reportCards").innerHTML=`
    <div class="card"><div class="k">Orders placed</div><div class="v">${d.ordersPlaced}</div></div>
    <div class="card"><div class="k">Cancelled</div><div class="v">${d.ordersCancelled}</div></div>
    <div class="card"><div class="k">Volume traded</div><div class="v">${d.userVolume}</div></div>
    <div class="card"><div class="k">Net P&amp;L</div>
      <div class="v ${signClass(d.totalPnl)}">$${money(d.totalPnl)}</div></div>`;
  $("reportRows").innerHTML = d.perSymbol.length? d.perSymbol.map(s=>`
    <tr><td>${s.symbol}</td><td class="mono">${s.bought}</td><td class="mono">${s.sold}</td>
      <td class="mono ${signClass(s.position)}">${s.position}</td>
      <td class="mono">${s.avgBuy?'$'+money(s.avgBuy):'-'}</td>
      <td class="mono">${s.avgSell?'$'+money(s.avgSell):'-'}</td>
      <td class="mono">$${money(s.mark)}</td>
      <td class="mono ${signClass(s.pnl)}">$${money(s.pnl)}</td></tr>`).join("")
    : `<tr><td colspan="8" style="text-align:center;color:var(--muted)">No trades yet — place some orders first.</td></tr>`;
  $("overlay").classList.add("show");
}
function closeReport(){ $("overlay").classList.remove("show"); }

// ---------- polling ----------
function selectSym(s){ SEL=s; setSide(SIDE); refresh(); }
async function refresh(){
  try{
    const [syms,book,tape,mine]=await Promise.all([
      getJSON("/api/symbols"),
      getJSON("/api/book?symbol="+SEL+"&depth=10"),
      getJSON("/api/trades?symbol="+SEL+"&limit=22"),
      getJSON("/api/myorders")]);
    renderWatch(syms); renderBook(book); renderTape(tape); renderMyOrders(mine);
    $("clock").textContent = new Date().toLocaleTimeString();
  }catch(e){ $("clock").textContent="reconnecting…"; }
}
setSide("BUY"); onTypeChange(); refresh();
setInterval(refresh, 900);
</script>
</body>
</html>
