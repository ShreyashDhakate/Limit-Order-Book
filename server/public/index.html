<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e13" />
  <meta name="description" content="A live trading terminal powered by a C++ price/time-priority matching engine." />
  <title>C++ LOB · Trade</title>
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/terminal.css" />
</head>
<body data-page="terminal">

  <!-- ============================== APP BAR ============================== -->
  <header class="appbar">
    <a class="brand" href="/index.html">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v6M6 14v6M18 4v10M18 18v2M12 8v3M12 15v1"/><rect x="4" y="10" width="4" height="4" rx="1"/><rect x="16" y="14" width="4" height="4" rx="1"/><rect x="10" y="11" width="4" height="4" rx="1"/></svg></span>
      <b>C++ LOB <span>Exchange</span></b>
    </a>
    <nav class="nav">
      <a href="/index.html" data-nav="terminal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l4-4 3 3 5-6 4 4"/><path d="M4 20h16"/></svg>Trade</a>
      <a href="/orders.html" data-nav="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Orders</a>
    </nav>
    <div class="bar-right">
      <span class="pnl-chip" title="Your total profit & loss, marked to the live price"><span class="lbl">P&amp;L</span><span class="val mono" id="pnlChip">$0.00</span></span>
      <span class="conn" id="conn"><span class="dot"></span><span class="txt">Live</span></span>
    </div>
  </header>

  <!-- ============================== TERMINAL ============================= -->
  <main class="page">
    <div class="seg mtabs" id="mtabs">
      <button data-sec="watch">Watchlist</button>
      <button data-sec="chart" class="on">Chart &amp; Book</button>
      <button data-sec="trade">Trade</button>
    </div>

    <div class="terminal" id="terminal" data-sec="chart">

      <!-- LEFT: watchlist -->
      <div class="col left">
        <div class="card grow wl">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input id="wlSearch" type="search" placeholder="Search symbol  ( / )" autocomplete="off" spellcheck="false" />
          </div>
          <div class="wl-list" id="watchlist"></div>
        </div>
      </div>

      <!-- CENTER: header + chart + book -->
      <div class="col center">
        <div class="card grow">
          <div class="sym-head">
            <div class="sym-id"><div class="s" id="symName">—</div><div class="n" id="symDesc">select a symbol</div></div>
            <div class="sym-last"><span class="p" id="symLast">—</span><span class="c" id="symChg"></span></div>
            <div class="sym-kpis">
              <div class="kpi"><div class="k">Bid</div><div class="v up" id="kBid">—</div></div>
              <div class="kpi"><div class="k">Ask</div><div class="v down" id="kAsk">—</div></div>
              <div class="kpi"><div class="k">Spread</div><div class="v" id="kSpread">—</div></div>
              <div class="kpi"><div class="k">Open</div><div class="v" id="kOpen">—</div></div>
            </div>
          </div>
          <div class="chart-wrap">
            <div class="chart-top">
              <span class="dim mono" id="chartMeta" style="font-size:11.5px"></span>
              <div class="rng tabs" id="chartRanges">
                <button data-range="300000">5M</button>
                <button data-range="600000" class="on">10M</button>
                <button data-range="0">Session</button>
              </div>
            </div>
            <canvas id="chart" class="chart" height="280"></canvas>
          </div>
          <div class="book">
            <div class="dob">
              <div class="dob-head">
                <div class="dh"><span class="up">Bid</span><span>Size</span></div>
                <div class="dh"><span class="down">Ask</span><span>Size</span></div>
              </div>
              <div class="dob-rows" id="dobRows"></div>
            </div>
            <div class="book-mid"><b id="midPx">—</b><span class="sp" id="midSpread">spread —</span></div>
            <div class="imbalance">
              <div class="imb-bar"><span class="imb-buy" id="imbBuy"></span><span class="imb-sell" id="imbSell"></span></div>
              <div class="imb-legend"><span class="up" id="imbBuyTxt">Buyers —</span><span class="down" id="imbSellTxt">Sellers —</span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: open orders + tape (fills), with the order ticket anchored at the bottom -->
      <div class="col right">
        <div class="card">
          <div class="card-h">Open Orders<span class="spacer"></span><span class="tag"><span id="ordCount">0</span> live</span></div>
          <div class="mini">
            <table>
              <thead><tr><th>Sym</th><th>Side</th><th>Price</th><th>Qty</th><th></th></tr></thead>
              <tbody id="openOrders"></tbody>
            </table>
          </div>
        </div>

        <div class="card tape-card">
          <div class="card-h">Time &amp; Sales<span class="spacer"></span><span class="tag" id="tapeSym"></span></div>
          <div class="mini">
            <table>
              <thead><tr><th>Price</th><th>Size</th><th>Side</th></tr></thead>
              <tbody id="tape"></tbody>
            </table>
          </div>
        </div>

        <div class="card ticket-card">
          <div class="card-h">Order Ticket<span class="spacer"></span><span class="tag" id="tktSym">—</span></div>
          <div class="ticket">
            <div class="seg bs side">
              <button class="buy on" id="sideBuy" type="button">BUY</button>
              <button class="sell" id="sideSell" type="button">SELL</button>
            </div>
            <div class="holdbar">
              <span class="k">Holdings</span><span class="v" id="hHeld">0</span>
              <span class="sep">·</span>
              <span class="k">Sellable</span><span class="v" id="hSell">0</span>
              <button class="maxbtn" id="hMax" type="button" hidden>Max</button>
            </div>
            <div>
              <label class="fld">Order type</label>
              <select id="oType">
                <option value="GTC">Limit</option>
                <option value="MKT">Market</option>
                <option value="IOC">Immediate-or-Cancel</option>
                <option value="FOK">Fill-or-Kill</option>
              </select>
            </div>
            <div class="row2">
              <div>
                <label class="fld">Price ($)</label>
                <input id="oPrice" class="mono" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" />
              </div>
              <div>
                <label class="fld">Quantity</label>
                <div class="stepper">
                  <button id="qtyMinus" type="button" aria-label="decrease">−</button>
                  <input id="oQty" class="mono" type="number" step="1" min="0" inputmode="numeric" value="100" />
                  <button id="qtyPlus" type="button" aria-label="increase">+</button>
                </div>
              </div>
            </div>
            <div class="est"><span class="dim">Est. value</span><span class="v" id="estVal">—</span></div>
            <button class="place buy" id="placeBtn">BUY</button>
            <div class="msg" id="msg"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ============================ BOTTOM NAV ============================= -->
  <nav class="bottomnav">
    <a href="/index.html" data-nav="terminal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l4-4 3 3 5-6 4 4"/><path d="M4 20h16"/></svg>Trade</a>
    <a href="/orders.html" data-nav="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Orders</a>
  </nav>

  <script src="/assets/js/format.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/store.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/terminal.js"></script>
</body>
</html>
